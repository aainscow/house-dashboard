plugins {
    id 'com.android.application'
}

// Release signing: ~/.config/demo-drive/keystore.properties (outside the repo), made by build-apk.sh on first build.
// Keep that folder: an update must be signed with the same key, or the phone needs the app reinstalled.
def ksFile = new File(System.getProperty('user.home'), '.config/demo-drive/keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'uk.demodrive.house'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.demodrive.house'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
