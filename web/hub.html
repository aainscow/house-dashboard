<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Drive · Hub</title>
<style>
  :root { --bg:#07090c; --ink:#f2f5f8; --ink2:#a8b1bd; --ink3:#66717f; --light:#ffb547; --heat:#ff6b4a;
          --cool:#4cc9f0; --solar:#ffd54a; --battery:#5be3a0; --grid:#a78bfa; --gas:#fb923c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family: "Google Sans", Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { background: radial-gradient(900px 500px at 0% 0%, rgba(255,181,71,.10), transparent 60%),
                      radial-gradient(800px 500px at 100% 100%, rgba(167,139,250,.10), transparent 60%), var(--bg); }
  .wrap { height:100vh; padding:3.2vh 3vw; display:grid; gap:2.2vh 2vw;
          grid-template-columns: 1.05fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr auto; }
  .clock { grid-column:1; grid-row:1 / 3; display:flex; flex-direction:column; justify-content:center; }
  .time { font-size:17vh; font-weight:300; letter-spacing:-.04em; line-height:.95; font-variant-numeric:tabular-nums; }
  .date { font-size:3.6vh; color:var(--ink2); margin-top:1vh; }
  .greet { font-size:3vh; color:var(--light); margin-top:2vh; }
  .tile { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07); border-radius:3vh;
          padding:2.4vh 2vw; display:flex; flex-direction:column; justify-content:space-between; min-width:0; }
  .k { font-size:2.3vh; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); }
  .v { font-size:7.4vh; font-weight:400; line-height:1; font-variant-numeric:tabular-nums; }
  .s { font-size:2.5vh; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .price.cheap { border-color:rgba(91,227,160,.5); background:rgba(91,227,160,.09); } .price.cheap .v { color:var(--battery); }
  .price.peak { border-color:rgba(255,107,74,.5); background:rgba(255,107,74,.09); } .price.peak .v { color:var(--heat); }
  .power .v { color:var(--grid); } .power.export .v { color:var(--battery); }
  .lights .v { color:var(--light); }
  .hw .v { color:var(--heat); } .loft .v { color:var(--cool); } .loft.heat .v { color:var(--heat); } .sun .v { color:var(--solar); }
  .rooms { grid-column:1; grid-row:3; display:grid; grid-template-columns:1fr 1fr; gap:1.4vh 1.4vw; align-content:center; }
  .room { display:flex; justify-content:space-between; align-items:baseline; font-size:2.8vh; color:var(--ink2);
          border-bottom:1px solid rgba(255,255,255,.06); padding-bottom:.8vh; }
  .room b { color:var(--ink); font-weight:400; font-size:3.4vh; font-variant-numeric:tabular-nums; }
  .strip { grid-column:1 / 4; grid-row:4; height:9vh; display:flex; align-items:flex-end; gap:.25vw; position:relative; }
  .strip i { flex:1; border-radius:.5vh .5vh 0 0; min-height:2px; }
  .strip .now { outline:2px solid #fff; outline-offset:1px; }
  .strip-l { position:absolute; left:0; top:-3vh; font-size:2vh; color:var(--ink3); letter-spacing:.08em; text-transform:uppercase; }
  .demo { position:fixed; right:2vw; top:1.5vh; font-size:1.8vh; color:#c4b5fd; letter-spacing:.1em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date"></div><div class="greet" id="greet"></div></div>
  <div class="tile price" id="t-price"><div class="k">Electricity now</div><div class="v" id="price">–</div><div class="s" id="price-next"></div></div>
  <div class="tile power" id="t-power"><div class="k" id="power-k">Using now</div><div class="v" id="power">–</div><div class="s" id="power-s"></div></div>
  <div class="tile lights"><div class="k">Lights on</div><div class="v" id="lights">–</div><div class="s" id="lights-s"></div></div>
  <div class="tile hw"><div class="k">Hot water</div><div class="v" id="hw">–</div><div class="s" id="hw-s"></div></div>
  <div class="rooms" id="rooms"></div>
  <div class="tile loft" id="t-loft"><div class="k">Loft</div><div class="v" id="loft">–</div><div class="s" id="loft-s"></div></div>
  <div class="tile sun"><div class="k">Solar &amp; battery</div><div class="v" id="sun">–</div><div class="s" id="sun-s"></div></div>
  <div class="strip" id="strip"><span class="strip-l">Today's prices</span></div>
</div>
<div class="demo" id="demo" hidden>DEMO</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const kw = (w) => Math.abs(w) >= 1000 ? (w / 1000).toFixed(1) + " kW" : Math.round(w) + " W";
const deg = (t) => t == null ? "–" : (+t).toFixed(1) + "°";
const hm = (ts) => new Date(ts * 1000).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const ROOMS = [["lounge", "Sitting room"], ["study", "Study"], ["conservatory", "Conserv."], ["landing", "Landing"],
               ["ensuite1", "Ensuite"], ["kitchen", "Kitchen"]];
let S;
function tick() {
  const d = new Date();
  $("#time").textContent = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  $("#date").textContent = d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  const h = d.getHours(); $("#greet").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
}
function temp(id) {
  const s = S.sensors[id]; if (s && s.live && s.temperature != null) return s.temperature;
  if (id === "bed1") return S.aircon.indoor_c;
  return S.zones[id]?.temperature ?? s?.temperature;
}
function render() {
  $("#demo").hidden = !S.demoMode;
  const o = S.octopus || {};
  const p = $("#t-price"); p.classList.toggle("cheap", o.rate_p != null && o.rate_p < 12); p.classList.toggle("peak", o.rate_p != null && o.rate_p > 28);
  $("#price").textContent = o.rate_p == null ? "–" : o.rate_p.toFixed(1) + "p";
  $("#price-next").textContent = o.next_rate_p == null ? "per kWh" : `${o.next_rate_p.toFixed(1)}p from ${hm(o.next_rate_at)}`;
  const w = (o.live && o.homeMini) ? o.demand_w : S.energy.grid_w, exp = w < 0;
  $("#t-power").classList.toggle("export", exp);
  $("#power-k").textContent = exp ? "Exporting now" : "Importing now";
  $("#power").textContent = kw(Math.abs(w));
  $("#power-s").textContent = o.elec_today_kwh ? `${o.elec_today_kwh.toFixed(1)} kWh ${o.usage_day && o.usage_day !== "today" ? o.usage_day : "today"}` : "";
  const on = Object.values(S.lights).filter((l) => l.on);
  const rooms = [...new Set(on.map((l) => S.layout.floors.flatMap((f) => f.rooms).find((r) => r.id === l.room)?.name))];
  $("#lights").textContent = on.length;
  $("#lights-s").textContent = rooms.length ? rooms.join(" · ") : "All off";
  $("#hw").textContent = deg(S.hotwater.temperature);
  $("#hw-s").textContent = S.hotwater.boost ? "Boosting" : S.hotwater.temperature >= 45 ? "Ready" : "Cool";
  const a = S.aircon;
  $("#t-loft").classList.toggle("heat", a.power && a.mode === "heat");
  $("#loft").textContent = deg(a.indoor_c);
  $("#loft-s").textContent = a.power ? `${a.mode[0].toUpperCase() + a.mode.slice(1)} to ${a.setpoint.toFixed(1)}°` : "Aircon off";
  $("#sun").textContent = kw(S.energy.solar_w);
  $("#sun-s").textContent = `Battery ${Math.round(S.energy.soc)}%` + (S.integrations.fox?.mode === "demo" ? " · demo" : "");
  $("#rooms").innerHTML = ROOMS.map(([id, n]) => `<div class="room">${n}<b>${deg(temp(id))}</b></div>`).join("");
  const m = new Date(); m.setHours(0, 0, 0, 0); const t0 = m.getTime() / 1000, now = Date.now() / 1000;
  const rates = (o.rates || []).filter((r) => r[0] >= t0 && r[0] < t0 + 86400);
  const max = Math.max(35, ...rates.map((r) => r[1]));
  $("#strip").innerHTML = `<span class="strip-l">Today's prices</span>` + rates.map(([ts, v]) => {
    const col = v < 12 ? "var(--battery)" : v > 28 ? "var(--heat)" : "var(--grid)";
    const cur = ts <= now && now < ts + 1800;
    return `<i class="${cur ? "now" : ""}" style="height:${Math.max(4, v / max * 100)}%;background:${col};opacity:${ts + 1800 < now ? .35 : 1}"></i>`;
  }).join("");
}
async function load() { try { S = await (await fetch("/api/state")).json(); render(); } catch (e) {} }
tick(); setInterval(tick, 5000);
load(); setTimeout(load, 2000); setInterval(load, 15000);  // simple polling: the Hub's browser doesn't need a live stream
</script>
</body>
</html>
